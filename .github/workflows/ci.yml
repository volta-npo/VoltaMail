name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck & Build
        run: pnpm build
      - name: Run tests
        run: pnpm test
      - name: Format check
        run: pnpm format
      - name: Validate Prisma schema
        run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voltamail
